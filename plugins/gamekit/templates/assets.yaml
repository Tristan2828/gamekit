# Asset manifest: one entry per asset the game needs. Check it with `gamekit validate`.
#
# Fields per asset:
#   id        lowercase snake_case, unique
#   kind      sprite | tileset | icon | ui | font | sfx | voice | music   (voice: spoken lines, .wav)
#   source    claude | self | pack | library | sfxr | synth | commission | ai (local AI model: gamekit engines)
#   status    todo | draft | done | keep   (keep: the game's own code-made version stays, by choice;
#             counts as finished, needs no file)
#   file      path inside `output` (.png for images, .wav for sfx and voice, .ogg for music)
#   size      [width, height] in pixels (images only; one frame for sprites)
#   frames    animation name -> frame count, e.g. {idle: 4, walk: 6} (sprites only)
#   replaces  optional: what this replaces in the game today (sprite / sound name)
#   src       optional: editable source file; default art/<id>.yaml (claude), art/<id>.aseprite (self),
#             sounds/<id>.yaml (sfxr)
#   license   {name, author, url}: required for pack / library / commission once not todo;
#             {pack: <name>} uses the license recorded in packs/<name>/pack.yaml
#   loop      music only: false for tracks that play once (default: music loops)
#   notes     anything else (style hints, where it's used)
game: My Game
output: assets          # folder for finished files, next to this manifest
palette: palette.hex    # every image is checked against these colors
# frame_files: true     # one PNG per animation frame (hero.png, hero_1.png, hero_walk_1.png, hero_attack.png)
#                       # instead of one sheet + .json per sprite
# code_art: src/art/pixel_art.gd  # the game's own text sprites (Godot: const PALETTE / const SPRITES of
#                       # text rows); the asset page shows them for images with no file yet. Sprite name =
#                       # `replaces`, else the id; frames are named like frame files (hero_walk_1)
# sprites:              # the game's sprite rules, used when a picture becomes a sprite (Pictures tab, picture-use)
#   prompt: "pixel art sprite, dark fantasy, front-facing, symmetrical, muted colors"  # starts picture descriptions
#   outline: "#17121C"  # 1 px outline drawn around the sprite (inside its size)
#   reserved_colors: ["#FF00FF", "#800080"]  # palette colors with a special meaning: never snapped to
#   game_scale: 3       # how much the game enlarges sprites on screen (default 3), for "as in game" previews
#   floors: {Dungeon: "#1C1A21"}  # floor colors sprites are seen on, for previews (default a dark grey)
# audio:                # house levels used by sfx / music commands unless a flag overrides them
#   sfx_peak_db: -1     # sound effect peak, dBFS
#   music_lufs: -16     # music loudness, LUFS (unset: music render keeps the game's own mix)
# music:                # for `music render` (the game's own code-made music, source: synth)
#   godot_project: .
#   render_script: tools/render_music.gd   # start from gamekit's templates/godot/render_music.gd

assets:
  - id: hero
    kind: sprite
    source: claude
    status: todo
    file: sprites/hero.png
    size: [16, 16]
    frames: {idle: 2, walk: 4}
    notes: Example entry. Replace with your game's assets.

  - id: hit
    kind: sfx
    source: sfxr
    status: todo
    file: sfx/hit.wav
